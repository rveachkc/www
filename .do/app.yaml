# DigitalOcean App Platform spec.
# Apply in the console: App → Settings → App Spec → Edit, paste this file, Save.
# Console edits are not synced back here -- copy changes into this file.
name: ryanveach-www
region: nyc

features:
  - buildpack-stack=ubuntu-22

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

static_sites:
  - name: www
    github:
      repo: rveachkc/www
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: jekyll
    build_command: bundle exec jekyll build
    output_dir: _site
    error_document: 404.html
    envs:
      - key: JEKYLL_ENV
        value: production
        scope: BUILD_TIME

ingress:
  rules:
    # www -> apex
    - match:
        authority:
          exact: www.ryanveach.com
        path:
          prefix: /
      redirect:
        authority: ryanveach.com
        redirect_code: 301
    # old WordPress feed URLs (/feed, /feed/, /feed/atom/, ...); prefixes match whole
    # path segments, so /feed.xml itself is not caught
    - match:
        path:
          prefix: /feed
      redirect:
        uri: /feed.xml
        redirect_code: 301
    - match:
        path:
          prefix: /
      component:
        name: www

domains:
  - domain: www.ryanveach.com
    type: ALIAS
    zone: ryanveach.com
  - domain: ryanveach.com
    type: PRIMARY
    zone: ryanveach.com
